# Lab-only verification of a lever branch on the fork (AlxcBTW/AnyPS5). Same steps as the linux and windows
# jobs of build.yml (configure, test registration check, build, libs, ctest), started by a push to ci/lab/**.
name: Lever verify

on:
  push:
    branches: ['ci/lab/**']

permissions:
  contents: read

concurrency:
  group: lever-verify-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  linux:
    if: github.repository == 'AlxcBTW/AnyPS5'
    # LEVER_LINUX_RUNNER is a JSON list of Namespace runner labels; without it the job runs on GitHub.
    runs-on: ${{ vars.LEVER_LINUX_RUNNER && fromJSON(vars.LEVER_LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      # Namespace: ccache lives on the runner's cache volume (no upload or download), and the privileged
      # container lets the write-watch tests use userfaultfd.
      - name: Keep ccache on the Namespace cache volume
        if: startsWith(runner.name, 'nsc-')
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.ccache
      - uses: hendrikmuhs/ccache-action@v1.2.24
        if: ${{ !startsWith(runner.name, 'nsc-') }}
        with:
          key: linux
          evict-old-files: job
      - name: Install lavapipe and the SDL audio and XRandR development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev libxrandr-dev
      - name: Prepare the Namespace runner
        if: startsWith(runner.name, 'nsc-')
        run: |
          sudo sysctl -w vm.unprivileged_userfaultfd=1
          sudo apt-get install -y --no-install-recommends ccache ninja-build
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          CCACHE_DIR=$HOME/.ccache ccache -M 15G -z
      - run: cmake -S . -B build $CONFIGURE -DANYPS5_ENABLE_SPIRV_TOOLS=ON
      - name: Check that every test executable is registered with ctest
        run: python3 tools/check_test_registration.py build
      - run: cmake --build build -- -k 0
      - run: cmake --build build --target libs
      - run: ctest --test-dir build --output-on-failure --timeout 120 --parallel 4 --output-log ctest.log --output-junit ctest.xml
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
      - run: python3 tools/check_skips.py build/ctest.xml
      - name: ccache statistics
        if: startsWith(runner.name, 'nsc-') && !cancelled()
        run: ccache -s
      - name: Report tests slower than 30 s
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f ctest.log ] || exit 0
          awk '/Test +#[0-9]+: / && $NF == "sec" { for (i = 1; i <= NF; i++) if ($i ~ /^#[0-9]+:$/) name = $(i + 1); t = $(NF - 1) + 0; if (t > max[name]) max[name] = t }
            END { for (name in max) if (max[name] > 30) printf "::warning title=Slow test::%s took %.1f s on %s; tests must finish in 30 s (CONTRIBUTING.md)\n", name, max[name], ENVIRON["RUNNER_OS"] }' ctest.log

  windows:
    if: github.repository == 'AlxcBTW/AnyPS5'
    runs-on: ${{ vars.LEVER_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 45
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows
          evict-old-files: job
      - shell: cmd
        run: cmake -S . -B build %CONFIGURE%
      - name: Check that every test executable is registered with ctest
        shell: cmd
        run: python tools/check_test_registration.py build
      - shell: cmd
        run: cmake --build build -- -k 0
      - shell: cmd
        run: cmake --build build --target libs
      - shell: cmd
        run: ctest --test-dir build --output-on-failure --timeout 120 --parallel 4 --output-log ctest.log --output-junit ctest.xml
      - run: python tools/check_skips.py build/ctest.xml --job windows
      - name: Report tests slower than 30 s
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f ctest.log ] || exit 0
          awk '/Test +#[0-9]+: / && $NF == "sec" { for (i = 1; i <= NF; i++) if ($i ~ /^#[0-9]+:$/) name = $(i + 1); t = $(NF - 1) + 0; if (t > max[name]) max[name] = t }
            END { for (name in max) if (max[name] > 30) printf "::warning title=Slow test::%s took %.1f s on %s; tests must finish in 30 s (CONTRIBUTING.md)\n", name, max[name], ENVIRON["RUNNER_OS"] }' ctest.log
